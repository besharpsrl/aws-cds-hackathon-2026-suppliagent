[project]
name = "suppliagent-shared"
version = "0.1.0"
description = "Shared library for SuppliAgent Lambda functions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.43.118",
  "aws-lambda-powertools>=3.37.0",
  "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
