[project]
name = "suppliagent-agent"
version = "0.1.0"
description = "SuppliAgent Strands agent for Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "strands-agents>=1.62.0",
  "bedrock-agentcore>=1.24.2",
  # imported directly; already in the lock as dependencies of the two above
  "boto3>=1.43.118",
  "httpx>=0.28.1",
  "pydantic>=2.14.1",
  "aws-opentelemetry-distro>=0.12",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
