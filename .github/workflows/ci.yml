name: CI

on:
  # Draft PRs are skipped: CI runs when a PR is opened or marked ready for review, and on every later push.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CDK_DISABLE_CLI_TELEMETRY: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy services agent tests seed scripts
      - run: uv run pytest

  typescript:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # uv: `cdk synth` bundles the Python Lambda and agent code locally (no Docker).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
          enable-cache: true
      - run: npm ci
      - run: npm run lint:ts
      - run: npm run typecheck -w infra
      - run: npm test -w infra
      # cdk-nag runs as a policy validation plugin: any unacknowledged error fails the synth.
      # No AWS credentials needed: stacks are account-agnostic and do no lookups.
      - name: cdk synth (dev)
        working-directory: infra
        run: npx cdk synth -q -c env=dev
