<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="crust" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#F7C25A"/>
      <stop offset="0.55" stop-color="#E39130"/>
      <stop offset="1" stop-color="#B85E17"/>
    </radialGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F06A3A"/>
      <stop offset="1" stop-color="#C93A1E"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19C29A"/>
      <stop offset="1" stop-color="#0E9476"/>
    </linearGradient>
    <clipPath id="body"><ellipse cx="0" cy="0" rx="172" ry="94"/></clipPath>
    <mask id="crustMask" maskUnits="userSpaceOnUse" x="-300" y="-300" width="600" height="600">
      <rect x="-300" y="-300" width="600" height="600" fill="#fff"/>
      <circle cx="178" cy="-38" r="70" fill="#000"/>
      <circle cx="160" cy="40" r="56" fill="#000"/>
    </mask>
    <mask id="riceMask" maskUnits="userSpaceOnUse" x="-300" y="-300" width="600" height="600">
      <circle cx="178" cy="-38" r="70" fill="#fff"/>
      <circle cx="160" cy="40" r="56" fill="#fff"/>
      <circle cx="178" cy="-38" r="52" fill="#000"/>
      <circle cx="160" cy="40" r="38" fill="#000"/>
    </mask>
  </defs>

  <!-- background tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#1F2A44"/>

  <!-- chat bubble (supplì al telefono → agente in chat) -->
  <g>
    <path d="M330 70 h118 a26 26 0 0 1 26 26 v52 a26 26 0 0 1 -26 26 h-62 l-26 24 v-24 h-30 a26 26 0 0 1 -26 -26 v-52 a26 26 0 0 1 26 -26z" fill="url(#bubble)"/>
    <circle cx="358" cy="122" r="10" fill="#fff"/>
    <circle cx="389" cy="122" r="10" fill="#fff"/>
    <circle cx="420" cy="122" r="10" fill="#fff"/>
  </g>

  <!-- the supplì -->
  <g transform="translate(232 300) rotate(-20)">
    <!-- shadow -->
    <ellipse cx="0" cy="104" rx="130" ry="12" fill="#000" opacity="0.22"/>
    <!-- headset band (behind the supplì) -->
    <path d="M-164 -10 C-170 -210 110 -215 100 -70" fill="none" stroke="#DDE4F0" stroke-width="14" stroke-linecap="round"/>
    <rect x="84" y="-104" width="30" height="44" rx="13" fill="#DDE4F0" transform="rotate(20 99 -82)"/>
    <!-- exposed rice along the bite -->
    <g clip-path="url(#body)">
      <rect x="-200" y="-200" width="400" height="400" fill="url(#rice)" mask="url(#riceMask)"/>
      <!-- rice grains -->
      <g fill="#FFB38F" opacity="0.8" mask="url(#riceMask)">
        <ellipse cx="118" cy="-60" rx="6" ry="3" transform="rotate(30 118 -60)"/>
        <ellipse cx="128" cy="-18" rx="6" ry="3" transform="rotate(-20 128 -18)"/>
        <ellipse cx="112" cy="52" rx="6" ry="3" transform="rotate(50 112 52)"/>
        <ellipse cx="126" cy="80" rx="6" ry="3" transform="rotate(10 126 80)"/>
        <ellipse cx="140" cy="-92" rx="6" ry="3" transform="rotate(-40 140 -92)"/>
      </g>
      <!-- mozzarella core -->
      <path d="M112 2 q14 -16 24 -2 q8 14 -6 22 q-16 6 -18 -20z" fill="#FFF8E7"/>
    </g>

    <!-- crust -->
    <g mask="url(#crustMask)">
      <ellipse cx="0" cy="0" rx="172" ry="94" fill="url(#crust)"/>
      <!-- breadcrumb texture -->
      <g fill="#A9561A" opacity="0.45" clip-path="url(#body)"><circle cx="-69" cy="-56" r="3.0"/><circle cx="-140" cy="6" r="2.5"/><circle cx="-144" cy="1" r="1.9"/><circle cx="-39" cy="-69" r="2.0"/><circle cx="-41" cy="52" r="2.0"/><circle cx="-97" cy="20" r="3.5"/><circle cx="2" cy="-17" r="3.6"/><circle cx="-147" cy="57" r="2.3"/><circle cx="-120" cy="-61" r="2.4"/><circle cx="69" cy="-51" r="2.8"/><circle cx="19" cy="-20" r="2.8"/><circle cx="-142" cy="-70" r="2.2"/><circle cx="31" cy="-12" r="2.4"/><circle cx="4" cy="-7" r="2.3"/><circle cx="62" cy="32" r="2.2"/><circle cx="1" cy="4" r="3.4"/><circle cx="44" cy="-34" r="3.6"/><circle cx="-127" cy="-13" r="3.2"/><circle cx="-117" cy="-2" r="1.9"/><circle cx="27" cy="42" r="2.8"/><circle cx="85" cy="-30" r="3.1"/><circle cx="6" cy="13" r="2.6"/><circle cx="75" cy="71" r="2.7"/><circle cx="26" cy="-70" r="3.1"/><circle cx="21" cy="79" r="3.3"/><circle cx="-80" cy="-18" r="3.0"/><circle cx="-154" cy="-6" r="2.1"/><circle cx="-127" cy="-71" r="3.2"/><circle cx="-124" cy="-40" r="2.5"/><circle cx="84" cy="-67" r="2.6"/><circle cx="-6" cy="61" r="3.3"/><circle cx="82" cy="-35" r="2.5"/><circle cx="-60" cy="61" r="3.5"/><circle cx="-118" cy="-52" r="2.2"/><circle cx="-95" cy="-2" r="2.9"/><circle cx="-86" cy="-79" r="2.6"/><circle cx="-57" cy="11" r="3.5"/><circle cx="33" cy="2" r="2.9"/><circle cx="29" cy="-71" r="3.4"/><circle cx="58" cy="60" r="3.2"/><circle cx="-50" cy="-16" r="2.0"/><circle cx="18" cy="-70" r="1.9"/><circle cx="-102" cy="-54" r="2.4"/><circle cx="-145" cy="-80" r="2.1"/><circle cx="-132" cy="-22" r="1.8"/></g>
      <g fill="#FFE08A" opacity="0.7" clip-path="url(#body)"><circle cx="85" cy="18" r="1.7"/><circle cx="-89" cy="-24" r="2.0"/><circle cx="-126" cy="56" r="3.0"/><circle cx="-30" cy="-3" r="1.6"/><circle cx="-131" cy="-25" r="1.9"/><circle cx="72" cy="-54" r="1.5"/><circle cx="106" cy="5" r="1.7"/><circle cx="-8" cy="-76" r="2.3"/><circle cx="114" cy="58" r="2.5"/><circle cx="-87" cy="-21" r="1.8"/><circle cx="56" cy="5" r="2.7"/><circle cx="-68" cy="-44" r="2.7"/><circle cx="116" cy="56" r="2.7"/><circle cx="69" cy="38" r="1.8"/><circle cx="-15" cy="-23" r="1.5"/><circle cx="-152" cy="-35" r="1.9"/><circle cx="34" cy="73" r="2.2"/><circle cx="102" cy="78" r="2.9"/><circle cx="-58" cy="-45" r="1.8"/><circle cx="-105" cy="-47" r="2.4"/><circle cx="92" cy="54" r="2.2"/><circle cx="23" cy="48" r="1.6"/><circle cx="25" cy="66" r="2.7"/><circle cx="50" cy="-4" r="1.8"/><circle cx="61" cy="-27" r="2.7"/><circle cx="112" cy="-17" r="2.1"/><circle cx="105" cy="36" r="1.8"/><circle cx="-124" cy="-56" r="2.9"/><circle cx="66" cy="-57" r="2.7"/><circle cx="114" cy="25" r="2.0"/><circle cx="-6" cy="-59" r="1.5"/><circle cx="112" cy="24" r="2.3"/><circle cx="101" cy="-11" r="2.8"/><circle cx="71" cy="-46" r="1.9"/><circle cx="-78" cy="-42" r="2.4"/></g>
      <!-- highlight -->
      <ellipse cx="-70" cy="-58" rx="60" ry="18" fill="#FFF3C4" opacity="0.35" transform="rotate(-8 -70 -58)"/>
    </g>

    <!-- face -->
    <g>
      <ellipse cx="-78" cy="-8" rx="21" ry="24" fill="#fff"/>
      <ellipse cx="-14" cy="-8" rx="21" ry="24" fill="#fff"/>
      <circle cx="-72" cy="-4" r="11" fill="#1F2A44"/>
      <circle cx="-8" cy="-4" r="11" fill="#1F2A44"/>
      <circle cx="-68" cy="-9" r="4" fill="#fff"/>
      <circle cx="-4" cy="-9" r="4" fill="#fff"/>
      <path d="M-70 36 q26 24 52 0" fill="none" stroke="#1F2A44" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="-108" cy="30" rx="13" ry="8" fill="#E8572C" opacity="0.45"/>
      <ellipse cx="20" cy="30" rx="13" ry="8" fill="#E8572C" opacity="0.45"/>
    </g>

    <!-- headset (front parts) -->
    <rect x="-180" y="-36" width="34" height="62" rx="15" fill="#DDE4F0"/>
    <rect x="-174" y="-28" width="16" height="46" rx="8" fill="#19C29A"/>
    <path d="M-163 24 C-163 66 -130 70 -104 58" fill="none" stroke="#DDE4F0" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-100" cy="56" r="11" fill="#1F2A44" stroke="#DDE4F0" stroke-width="4"/>
  </g>

  <!-- stretchy mozzarella string to the chat bubble -->
  <path d="M352 268 C 392 252, 340 226, 372 200" fill="none" stroke="#FFF8E7" stroke-width="10" stroke-linecap="round"/>
  <path d="M352 268 C 392 252, 340 226, 372 200" fill="none" stroke="#F3E3BE" stroke-width="3" stroke-linecap="round" transform="translate(2 1)"/>
</svg>
