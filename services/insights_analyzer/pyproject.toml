[project]
name = "suppliagent-insights-analyzer"
version = "0.1.0"
description = "SuppliAgent insights & reorder analyzer (T-08, FN-19/20): nightly per-customer insights from the order history"
requires-python = ">=3.12,<3.13"
dependencies = ["suppliagent-shared"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "insights_analyzer"
