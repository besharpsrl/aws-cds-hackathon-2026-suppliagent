name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy services agent tests
      - run: uv run pytest

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:ts
      - run: npm run typecheck -w infra
      - run: npm test -w infra
      # cdk-nag runs as a policy validation plugin: any unacknowledged error fails the synth.
      # No AWS credentials needed: stacks are account-agnostic and do no lookups.
      - name: cdk synth (dev, demo)
        working-directory: infra
        run: |
          npx cdk synth -q -c env=dev
          npx cdk synth -q -c env=demo
