[project]
name = "suppliagent-order-pdf"
version = "0.1.0"
description = "SuppliAgent order PDF generator (T-07, FN-14): dependency-free PDF of a confirmed order, stored in S3 documents/"
requires-python = ">=3.12,<3.13"
dependencies = ["suppliagent-shared"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "order_pdf"
