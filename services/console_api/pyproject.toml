[project]
name = "suppliagent-console-api"
version = "0.1.0"
description = "SuppliAgent console REST API (T-60): read-only orders for the back-office console"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.43.118",
  "aws-lambda-powertools>=3.37.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "console_api"
