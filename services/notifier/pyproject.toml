[project]
name = "suppliagent-notifier"
version = "0.1.0"
description = "SuppliAgent Notifier: single outbound point to the CDS channels (T-24). WhatsApp template definitions in whatsapp_templates/."
requires-python = ">=3.12,<3.13"
dependencies = ["suppliagent-shared"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "notifier"
