[project]
name = "suppliagent"
version = "0.1.0"
description = "SuppliAgent monorepo (uv workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "suppliagent-shared",
  "suppliagent-agent",
  "suppliagent-catalog-indexer",
  "suppliagent-console-api",
  "suppliagent-inbound-router",
  "suppliagent-notifier",
  "suppliagent-turn-dispatcher",
  "suppliagent-tool-catalog",
  "suppliagent-tool-customers",
  "suppliagent-tool-order-intake",
]

[tool.uv]
package = false

[tool.uv.sources]
suppliagent-shared = { workspace = true }
suppliagent-agent = { workspace = true }
suppliagent-catalog-indexer = { workspace = true }
suppliagent-console-api = { workspace = true }
suppliagent-inbound-router = { workspace = true }
suppliagent-notifier = { workspace = true }
suppliagent-turn-dispatcher = { workspace = true }
suppliagent-tool-catalog = { workspace = true }
suppliagent-tool-customers = { workspace = true }
suppliagent-tool-order-intake = { workspace = true }

[tool.uv.workspace]
members = ["agent", "services/*", "services/tools/*"]
exclude = ["services/tools"]

[dependency-groups]
dev = [
  "ruff==0.17.2",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "moto==5.2.4",
  "boto3-stubs[essential]",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["infra", "console", "node_modules", "**/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
# Package roots, so files under services/ map to their import names (e.g. suppliagent_shared).
mypy_path = "services/shared/src:services/catalog_indexer/src:services/console_api/src:services/inbound_router/src:services/notifier/src:services/turn_dispatcher/src:services/tools/catalog/src:services/tools/catalog/tests/support:services/tools/customers/src:agent/src:services/tools/order_intake/src:services/tools/order_intake/tests"
exclude = ["(^|/)(node_modules|cdk\\.out|\\.venv)/"]

[tool.pytest.ini_options]
testpaths = ["tests", "services", "agent"]
addopts = "-q --import-mode=importlib"
